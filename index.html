<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextDrop — share .txt / .zip files for {{ days_to_live }} days</title>
<style>
  :root {
    --pink: #FF3D7F;
    --orange: #FF8A3D;
    --yellow: #FFD23D;
    --teal: #2EC4B6;
    --purple: #7B61FF;
    --ink: #1A1A2E;
    --paper: #FFF9F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 45%, var(--orange) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-size: 2.1rem;
    margin: 0 0 6px;
    color: var(--paper);
    text-shadow: 3px 3px 0 var(--ink);
    letter-spacing: -0.5px;
  }
  header p { color: var(--paper); margin: 0; font-size: 0.95rem; opacity: 0.9; }

  .card {
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 18px;
    box-shadow: 8px 8px 0 var(--ink);
    padding: 20px;
    margin-bottom: 22px;
  }

  .dropzone {
    border: 3px dashed var(--purple);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .dropzone:hover { background: #fff5fb; }
  .dropzone.dragover { background: #f0eaff; transform: scale(1.01); border-color: var(--pink); }
  .dropzone .big { font-size: 2rem; }
  .dropzone .sub { font-size: 0.85rem; color: #666; margin-top: 6px; }
  input[type=file] { display: none; }

  button {
    font-family: inherit;
    font-weight: 700;
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    background: var(--teal);
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.08s;
  }
  button:hover { transform: translate(-1px,-1px); }
  button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
  button.download { background: var(--yellow); }
  button.delete { background: var(--pink); color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  h2 { margin-top: 0; font-size: 1.15rem; }

  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    margin-bottom: 12px;
    background: #fff;
  }
  .file-row:nth-child(4n+1) { background: #FFF0F6; }
  .file-row:nth-child(4n+2) { background: #FFF8E8; }
  .file-row:nth-child(4n+3) { background: #EAFBF8; }
  .file-row:nth-child(4n+4) { background: #F2EFFF; }

  .file-icon { font-size: 1.6rem; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-weight: 700; overflow-wrap: anywhere; }
  .file-meta { font-size: 0.78rem; color: #555; margin-top: 2px; }
  .file-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .empty { text-align: center; color: #888; padding: 20px 0; font-size: 0.9rem; }
  .status { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .status.ok { color: #1a7d4a; }
  .status.err { color: #c0392b; }

  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--orange);
    color: #fff;
    margin-left: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌈 TextDrop</h1>
    <p>Upload .txt or .zip files, share the link, files vanish after {{ days_to_live }} days.</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <div class="big">📄⬆️</div>
      <div><strong>Tap to choose a .txt or .zip file</strong></div>
      <div class="sub">or drag one here — max {{ max_size_mb }}&nbsp;MB</div>
    </div>
    <input type="file" id="fileInput" accept=".txt,text/plain,.zip,application/zip">
    <div class="status" id="uploadStatus"></div>
  </div>

  <div class="card">
    <h2>📚 Files <span id="countBadge" class="badge">0</span></h2>
    <div id="fileList"></div>
  </div>
</div>

<script>
const DAYS_TO_LIVE = {{ days_to_live }};
const MAX_SIZE_MB = {{ max_size_mb }};

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const uploadStatus = document.getElementById('uploadStatus');
const countBadge = document.getElementById('countBadge');

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}

function setStatus(msg, isErr) {
  uploadStatus.textContent = msg;
  uploadStatus.className = 'status ' + (isErr ? 'err' : 'ok');
  if (msg) setTimeout(() => { uploadStatus.textContent = ''; }, 4000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function iconFor(name) {
  return name.toLowerCase().endsWith('.zip') ? '🗜️' : '📝';
}

async function fetchFiles() {
  fileList.innerHTML = '<div class="empty">Loading files…</div>';
  let data;
  try {
    const res = await fetch('/api/files');
    data = await res.json();
  } catch (e) {
    fileList.innerHTML = '<div class="empty">Could not reach the server.</div>';
    return;
  }

  const files = data.files || [];
  countBadge.textContent = files.length;

  if (files.length === 0) {
    fileList.innerHTML = '<div class="empty">No files yet. Be the first to drop one! 🎉</div>';
    return;
  }

  fileList.innerHTML = '';
  for (const entry of files) {
    const uploadedDate = new Date(entry.uploaded_at * 1000).toLocaleDateString();
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <div class="file-icon">${iconFor(entry.name)}</div>
      <div class="file-info">
        <div class="file-name">${escapeHtml(entry.name)}</div>
        <div class="file-meta">${fmtBytes(entry.size)} · uploaded ${uploadedDate} · ${entry.days_left} day${entry.days_left === 1 ? '' : 's'} left</div>
      </div>
      <div class="file-actions">
        <button class="download" data-id="${entry.id}">⬇️</button>
        <button class="delete" data-id="${entry.id}">🗑️</button>
      </div>
    `;
    fileList.appendChild(row);
  }

  fileList.querySelectorAll('button.download').forEach(btn => {
    btn.addEventListener('click', () => {
      window.location.href = '/api/download/' + btn.dataset.id;
    });
  });

  fileList.querySelectorAll('button.delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/files/' + btn.dataset.id, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        setStatus('File deleted.', false);
      } catch (e) {
        setStatus('Could not delete file.', true);
      }
      fetchFiles();
    });
  });
}

async function handleFile(file) {
  if (!file) return;
  const name = file.name.toLowerCase();
  const isAllowed = name.endsWith('.txt') || name.endsWith('.zip');
  if (!isAllowed) { setStatus('Only .txt and .zip files are allowed.', true); return; }

  setStatus('Uploading…', false);
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.error || 'Upload failed.', true);
      return;
    }
    setStatus('Uploaded! It will auto-delete in ' + DAYS_TO_LIVE + ' days.', false);
    fetchFiles();
  } catch (e) {
    setStatus('Upload failed. Please try again.', true);
  }
  fileInput.value = '';
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fetchFiles();
</script>
</body>
</html>
